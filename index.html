<title>ماشین حساب کمیسیون املاک</title>
<link href="https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --bg:#f1f5fc;--card:#ffffff;--text:#0b1230;--muted:#5f6b8f;--line:#e0e8f5;
  --accent:#2a3a7a;--accent2:#5a8cb8;--soft:#e8f0fc;--g1:#17184a;--g2:#4f84b4;--brandbg:rgba(255,255,255,.3);--brandtext:#17184a;--logofx:none;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){color-scheme:dark;--bg:#070b1f;--card:#0f1634;--text:#eaf1ff;--muted:#93a2cf;--line:#1c2650;--accent:#7aa6d0;--accent2:#9cc0e2;--soft:#16224d;--g1:#232770;--g2:#4f84b4;--brandbg:rgba(255,255,255,.9);--brandtext:#17184a;--logofx:none}
}
:root[data-theme="dark"]{color-scheme:dark;--bg:#070b1f;--card:#0f1634;--text:#eaf1ff;--muted:#93a2cf;--line:#1c2650;--accent:#7aa6d0;--accent2:#9cc0e2;--soft:#16224d;--g1:#232770;--g2:#4f84b4;--brandbg:rgba(255,255,255,.9);--brandtext:#17184a;--logofx:none}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;overflow-x:hidden;background:var(--bg);color:var(--text);font-family:'Vazirmatn',Tahoma,sans-serif;min-height:100vh;display:flex;justify-content:center;padding:24px 16px}
.wrap{width:100%;max-width:460px;min-width:0}
h1{font-size:22px;font-weight:800;margin:8px 0 4px}
.sub{color:var(--muted);font-size:13px;margin:0 0 20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:18px;box-shadow:0 10px 30px rgba(23,24,74,.10)}
.tabs{display:grid;grid-template-columns:1fr 1fr;background:var(--soft);border-radius:14px;padding:4px;gap:4px;margin-bottom:18px}
.tab{border:0;background:transparent;color:var(--muted);font:inherit;font-weight:600;padding:11px;border-radius:11px;cursor:pointer;transition:.2s}
.tab.on{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff;box-shadow:0 4px 12px rgba(23,24,74,.35)}
label{display:block;font-size:13px;color:var(--muted);margin:0 0 6px}
.field{margin-bottom:14px}
.inp{display:flex;align-items:center;background:var(--bg);border:1.5px solid var(--line);border-radius:14px;padding:0 14px;transition:.2s}
.inp:focus-within{border-color:var(--accent);box-shadow:0 0 0 4px var(--soft)}
.inp input{flex:1;min-width:0;border:0;background:transparent;color:var(--text);font:inherit;font-size:18px;font-weight:600;padding:13px 0;outline:none;direction:ltr;text-align:right}
.inp span{color:var(--muted);font-size:12px;margin-right:8px}
.hint{font-size:12px;color:var(--muted);margin-top:6px;height:18px;line-height:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.pair .field{min-width:0}
.inp input{width:100%}
.pair .inp{padding:0 10px}
.pair .inp input{font-size:16px}
.pair .inp span{font-size:11px;margin-right:5px}
.res{margin-top:6px;border-top:1px dashed var(--line);padding-top:14px;display:grid;gap:10px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px;background:var(--bg);border-radius:14px;padding:13px 14px}
.row b{font-size:17px;white-space:nowrap}
.row small{color:var(--muted);font-size:12px;display:block;margin-top:2px}
.row.total{background:linear-gradient(135deg,var(--g1),var(--g2));color:#fff}
.row.total small{color:rgba(255,255,255,.8)}
.brand{display:flex;align-items:center;justify-content:center;gap:12px;margin:18px auto 0;width:fit-content;max-width:100%;background:var(--brandbg);border:1px solid var(--line);border-radius:18px;padding:10px 18px;color:var(--brandtext);font-weight:600;letter-spacing:.2px}
.brand img{height:44px;width:auto;display:block;filter:var(--logofx)}
.brand .t{display:flex;flex-direction:column;justify-content:center;text-align:left;line-height:1.35}
.brand .t .a{font-size:11px;font-weight:400;opacity:.8}
.brand .t .b{font-size:15px;font-weight:700}
.foot{text-align:center;color:var(--muted);font-size:11.5px;margin-top:14px;line-height:1.9}
</style>
</head>
<body>
<div class="wrap">
  <h1>ماشین حساب کمیسیون املاک</h1>
  <p class="sub">محاسبهٔ سریع کمیسیون و مالیات هر طرف معامله</p>
  <div class="card">
    <div class="tabs">
      <button class="tab on" id="t1" type="button">خرید و فروش</button>
      <button class="tab" id="t2" type="button">رهن و اجاره</button>
    </div>

    <div id="m1">
      <div class="field">
        <label for="price">مبلغ معامله</label>
        <div class="inp"><input id="price" inputmode="numeric" placeholder="0" autocomplete="off"><span>تومان</span></div>
        <div class="hint" id="h1"></div>
      </div>
    </div>

    <div id="m2" hidden>
      <div class="pair">
        <div class="field">
          <label for="rahn">رهن</label>
          <div class="inp"><input id="rahn" inputmode="numeric" placeholder="0" autocomplete="off"><span>تومان</span></div>
          <div class="hint" id="h2"></div>
        </div>
        <div class="field">
          <label for="rent">اجاره</label>
          <div class="inp"><input id="rent" inputmode="numeric" placeholder="0" autocomplete="off"><span>تومان</span></div>
          <div class="hint" id="h3"></div>
        </div>
      </div>
    </div>

    <div class="res">
      <div class="row"><div>سهم هر طرف</div><b id="r1">۰</b></div>
      <div class="row"><div>مالیات هر طرف</div><b id="r2">۰</b></div>
      <div class="row total"><div>پرداختی کمیسیون هر طرف</div><b id="r3">۰</b></div>

<script>
(function(){
  var fa=new Intl.NumberFormat('fa-IR');
  var $=function(i){return document.getElementById(i)};
  var mode=1;
  function toNum(s){
    s=String(s).replace(/[۰-۹]/g,function(d){return '۰۱۲۳۴۵۶۷۸۹'.indexOf(d)})
      .replace(/[٠-٩]/g,function(d){return '٠١٢٣٤٥٦٧٨٩'.indexOf(d)})
      .replace(/[^0-9]/g,'');
    return s?Number(s):0;
  }
  function fmt(n){return fa.format(Math.round(n))}
  function bind(id,hint){
    var el=$(id);
    el.addEventListener('input',function(){
      var n=toNum(el.value);
      el.value=n?n.toLocaleString('en-US'):'';
      $(hint).textContent=n?fmt(n)+' تومان':'';
      calc();
    });
  }
  function calc(){
    var s,d;
    if(mode===1){
      var p=toNum($('price').value);
      s=p*0.0025;
      d='۰٫۲۵٪ از مبلغ وارد شده';
    }else{
      var r=toNum($('rahn').value),a=toNum($('rent').value);
      s=(r/1000000)*5000+a*0.25;
      d='هر یک میلیون رهن ۵٬۰۰۰ تومان + ۰٫۲۵ اجاره';
    }
    var t=s*0.1;
        $('r1').textContent=fmt(s);
    $('r2').textContent=fmt(t);
    $('r3').textContent=fmt(s+t);
  }
  function setMode(m){
    mode=m;
    $('t1').classList.toggle('on',m===1);
    $('t2').classList.toggle('on',m===2);
    $('m1').hidden=m!==1;
    $('m2').hidden=m!==2;
    calc();
  }
  $('t1').onclick=function(){setMode(1)};
  $('t2').onclick=function(){setMode(2)};
  bind('price','h1');bind('rahn','h2');bind('rent','h3');
  setMode(1);
})();
</script>
